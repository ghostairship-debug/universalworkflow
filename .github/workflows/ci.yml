name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e .
      - name: Check docs
        run: python -m infra.scripts.check_doc_links
      - name: Doc command smoke
        run: make doc-command-smoke
      - name: Doctor strict
        run: make doctor-strict
      - name: Core tests
        run: make test-core
      - name: Test matrix smoke
        run: workflowctl --db-path state/workflow.db --workspace-root "$GITHUB_WORKSPACE" test matrix --suite core --dry-run
      - name: Capability probe parser tests
        run: python -m pytest tests/test_capability_probe.py -q
      - name: Scoped receipt smoke
        run: python -m pytest tests/test_operator_action_receipt.py -q
      - name: Offline validation
        run: python -m infra.scripts.offline_validation --suite quick --skip-offline-probe
