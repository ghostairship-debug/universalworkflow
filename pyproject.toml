[project]
name = "universal-agentic-workflow-os"
version = "0.66.0"
description = "Local-first runtime for Universal Agentic Workflow OS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135.2,<1.0.0",
  "openai>=2.26.0,<3.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "rich>=13.0.0,<15.0.0",
  "typer>=0.9.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0"
]
m8 = [
  "langchain>=1.0.0,<2.0.0",
  "langchain-openai>=1.0.0,<2.0.0",
  "langgraph>=1.0.0,<2.0.0"
]
mcp = [
  "mcp>=1.18.0,<2.0.0"
]

[project.scripts]
workflowctl = "apps.operator_cli.main:run"
workflow-remote-worker = "apps.remote_worker_api.main:run"
workflow-scheduler-authority = "apps.scheduler_authority_api.main:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "infra*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: slow end-to-end CLI/API/Web/release tests skipped by default; use --run-slow for full validation"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
