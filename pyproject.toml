[project]
name = "universal-agentic-workflow-os"
version = "0.1.0"
description = "M0 local-first bootstrap for Universal Agentic Workflow OS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135.2,<0.136.0",
  "pydantic>=2.12.5,<2.13.0",
  "typer>=0.9.0,<0.10.0",
  "uvicorn>=0.34.0,<0.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0.0"
]

[project.scripts]
workflowctl = "apps.operator_cli.main:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
